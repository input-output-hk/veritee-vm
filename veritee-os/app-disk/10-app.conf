# Read-only application filesystem, paired with 11-app-verity.conf.
[Partition]
Label=app
Type=linux-generic
Format=squashfs

# Place the staged application at the filesystem root.
CopyFiles=/workdir/disk:/

# Use the same match key for the data partition and its verity hash tree.
Verity=data
VerityMatchKey=app
Minimize=guess
